<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decennial Pipeline</title>
<link href='https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.css' rel='stylesheet' />
<script src='https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.js'></script>
<!-- d3 + topojson moved to pinned CDN (were 300KB vendored inline; browser-cached now).
     US state topology is fetched at runtime from us-atlas (same pre-projected Albers data
     that was previously embedded). One-line revert: re-inline if CDN dependence bothers you. -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#241D5A; --ink2:#473459; --violet:#6E4FA0; --gold:#B8920C; --teal:#0E7C9B;
    --paper:#F4F2F8; --panel:#FFFFFF; --panel2:#FAF8FC;
    --line:#E1DBEE; --line2:#CFC4E2; --muted:#7E7393; --dim:#A79BBC;
    --hyper:#2E2364; --edge:#0E7C9B; --neo:#C8941A; --untag:#B6AEC6;
    --land:#E8E2F2; --landline:#BFB2D6; --stateline:#A99BC5; --ramp0:#D8C9EC; --ramp1:#3C2A6E;
    --font:'Work Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;
    --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
    --t-micro:180ms; --t-snap:240ms; --t-view:340ms;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
  html,body{background:var(--paper)}
  body{font-family:var(--font);color:var(--ink2);min-height:100vh;padding:22px 24px 26px;
    background:radial-gradient(1100px 520px at 84% -14%, #ECE6F6 0%, transparent 58%),
      radial-gradient(820px 480px at -6% 110%, #EEEAF7 0%, transparent 55%), var(--paper);}
  .wrap{max-width:1560px;margin:0 auto}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;
    border-bottom:1.5px solid var(--line2);padding-bottom:16px;margin-bottom:18px;flex-wrap:wrap;position:relative}
  .brand{display:flex;align-items:center;gap:13px}
  .brand img{height:38px;width:auto;display:block}
  .brand .titles{display:flex;flex-direction:column;gap:3px;line-height:1}
  .brand h1{font-weight:700;font-size:23px;color:var(--ink);letter-spacing:-.005em}
  .brand .sub{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .tag{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);font-weight:700;
    border:1.5px solid var(--line2);border-radius:999px;padding:7px 14px;background:var(--panel)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;
    position:relative;overflow:hidden;transition:box-shadow .22s ease, transform .22s ease}
  .kpi:hover{box-shadow:0 6px 22px rgba(36,29,90,.10);transform:translateY(-1.5px)}
  .kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
  .kpi.cap:before{background:var(--gold)} .kpi.it:before{background:var(--teal)}
  .kpi .n{font-weight:800;font-size:31px;color:var(--ink);line-height:1;letter-spacing:-.02em}
  .kpi .n .u{font-size:12.5px;font-weight:600;color:var(--muted);margin-left:5px}
  .kpi .l{margin-top:9px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .kpi .l .est{font-size:9.5px;color:var(--dim);letter-spacing:.04em;text-transform:none;margin-left:3px;font-weight:500}

  .grid{display:grid;grid-template-columns:1fr;gap:16px;transition:grid-template-columns .3s ease}
  .grid.has-sel{grid-template-columns:minmax(0,1.55fr) minmax(354px,.92fr)}
  .card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 2px 16px rgba(36,29,90,.05)}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px 13px;border-bottom:1.5px solid var(--line)}
  .hd h2{font-weight:700;font-size:16.5px;color:var(--ink);letter-spacing:.005em}
  .hd .crumb{font-size:10.5px;color:var(--muted);letter-spacing:.1em;font-weight:600;text-transform:uppercase}
  .ctrls{display:flex;gap:7px;flex-wrap:wrap}
  /* Map/Grid view toggle */
  .vtoggle{display:inline-flex;border:1.5px solid var(--line2);border-radius:999px;overflow:hidden;flex:none}
  .vt{font-family:var(--font);font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--ink2);background:var(--panel);border:0;padding:6px 14px;cursor:pointer;transition:background var(--t-micro) var(--ease),color var(--t-micro) var(--ease)}
  .vt:hover{background:var(--panel2)}
  .vt.on{background:var(--ink);color:#fff}
  /* Grid / report view */
  .gridview{display:none;grid-column:1/-1;flex-direction:column;animation:gvfade var(--t-view) var(--ease)}
  @keyframes gvfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .grid.show-grid .card:not(.gridview){display:none}
  .grid.show-grid .gridview{display:flex}
  .grid.show-grid{grid-template-columns:1fr!important}
  .gridview .hd{display:flex;align-items:center;justify-content:space-between}
  .gv-stats{font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .gv-scroll{overflow:auto;height:clamp(540px,64vh,720px)}
  .gvtable{border-collapse:collapse;font-size:12px;width:100%;min-width:1180px}
  .gvtable thead th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:9px 9px;font-weight:700;color:var(--ink2);white-space:nowrap;border-bottom:1.5px solid var(--line2);font-size:11px;letter-spacing:.02em}
  .gvtable thead th.num{text-align:right}
  .gvtable thead th.ramphdr{text-align:center;color:var(--muted);font-size:10px;letter-spacing:.07em;text-transform:uppercase;border-left:1.5px solid var(--line);font-weight:700}
  .gvtable thead th.sortable{cursor:pointer;user-select:none;transition:color .12s ease}
  .gvtable thead th.sortable:hover{color:var(--ink)}
  .gv-clear{font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:none;
    background:var(--panel2);border:1.5px solid var(--line2);border-radius:999px;padding:3px 10px;margin-right:2px}
  .gv-clear:hover{border-color:var(--dim)}
  .gvtable thead tr.sub th{position:sticky;top:29px;font-size:10.5px;font-weight:600;color:var(--dim);padding:4px 9px 9px;text-align:right;background:var(--panel2)}
  .gvtable thead tr.sub th.rl{border-left:1.5px solid var(--line)}
  .gvtable td{padding:9px 9px;white-space:nowrap;border-bottom:1px solid var(--line);color:var(--muted)}
  .gvtable td.proj{position:sticky;left:0;background:var(--panel);font-weight:700;color:var(--ink);z-index:1}
  .gvtable td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
  .gvtable td.gross{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700;border-left:1.5px solid var(--line2)}
  .gvtable td.rl{border-left:1.5px solid var(--line)}
  .gvtable td .dot{color:var(--dim)}
  .gvtable tr{cursor:pointer;transition:background var(--t-micro) var(--ease)}
  .gvtable tbody tr:hover td{background:var(--panel2)}
  .gvtable tbody tr:hover td.proj{background:var(--panel2)}
  .gpill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
  .gpill.hy{background:#EEEDFE;color:var(--hyper)} .gpill.ed{background:#E1F5EE;color:#04342C} .gpill.ne{background:#FBEFD6;color:#7A5905}
  .gpill.intake{background:#FAEEDA;color:#633806} .gpill.preq{background:#EFEBF6;color:var(--ink2)}
  .gpow.eng{background:#E1F5EE;color:#0F6E56;font-weight:600;padding:2px 8px;border-radius:6px;font-size:11.5px}
  .gpow.ns{color:var(--dim);font-size:11.5px}
  .chip{font-family:var(--font);font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--ink2);
    background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;
    transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--line2)}
  .chip.disabled{opacity:.38;pointer-events:none;filter:grayscale(.65)}
  .chip:focus{outline:none}
  .chip:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(36,29,90,.16)}
  .chip .d{width:8px;height:8px;border-radius:50%;display:inline-block}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 0 0 3px rgba(36,29,90,.13)}
  .chip.on .d{background:#fff !important}
  .chip.hy.on{background:var(--hyper);border-color:var(--hyper);box-shadow:0 0 0 3px rgba(46,35,100,.16)}
  .chip.ed.on{background:var(--edge);border-color:var(--edge);box-shadow:0 0 0 3px rgba(14,124,155,.17)}
  .chip.ne.on{background:var(--neo);border-color:var(--neo);box-shadow:0 0 0 3px rgba(200,148,26,.2)}
  #back{display:none!important}
  .crumbs{display:flex;align-items:center;gap:8px;font-size:16.5px;font-weight:700;color:var(--ink);letter-spacing:.005em;flex-wrap:wrap}
  .crumbs .c-link{color:var(--muted);cursor:pointer;font-weight:600;transition:color .14s}
  .crumbs .c-link:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .crumbs .c-sep{color:var(--dim);font-weight:500;user-select:none}
  .crumbs .c-here{color:var(--ink)}

  .grid > .card:first-child{display:flex;flex-direction:column}
  .mapwrap{position:relative;flex:1 1 auto;min-height:clamp(540px,64vh,720px);overflow:hidden}
  #mbmap{position:absolute;inset:0;display:none;border-radius:0 0 14px 14px;opacity:0;transform:scale(1.025);
    transition:opacity var(--t-view) var(--ease), transform var(--t-view) var(--ease)}
  #mbmap.show{opacity:1;transform:scale(1)}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:1;transform:scale(1);
    transition:opacity var(--t-view) var(--ease), transform var(--t-view) var(--ease)}
  #map.fade{opacity:0;transform:scale(.975)}
  /* marker root — positioned by Mapbox, NEVER style transform here */
  .mb-anchor{cursor:pointer;opacity:1;transition:opacity var(--t-micro) var(--ease)}
  .mb-anchor.fading{opacity:0}
  .mb-marker{position:relative;width:19px;height:19px;border-radius:50%;
    border:3px solid #fff;
    /* layered shadow for actual depth: tight rim + soft cast shadow below+behind */
    box-shadow:0 0 0 1.5px rgba(36,29,90,.55), 0 1px 2px rgba(20,14,55,.35), 0 5px 10px -1px rgba(20,14,55,.45);
    animation:mkdrop .45s cubic-bezier(.2,.9,.3,1.25) backwards;
    transition:transform .15s ease, box-shadow .15s ease}
  .mb-marker::before{content:"";position:absolute;top:2px;left:3px;width:38%;height:38%;
    border-radius:50%;background:rgba(255,255,255,.6);filter:blur(.5px);pointer-events:none}
  .mb-anchor:hover .mb-marker{transform:scale(1.2);
    box-shadow:0 0 0 1.5px rgba(36,29,90,.72), 0 2px 3px rgba(20,14,55,.4), 0 8px 16px -2px rgba(20,14,55,.55)}
  @keyframes mkdrop{from{opacity:0;transform:translateY(-14px) scale(.6)}to{opacity:1;transform:translateY(0) scale(1)}}
  .mb-marker.pulse:after{content:"";position:absolute;left:50%;top:50%;width:100%;height:100%;
    border-radius:50%;border:2.5px solid currentColor;transform:translate(-50%,-50%);
    animation:mpulse 1.9s ease-out infinite;pointer-events:none}
  @keyframes mpulse{0%{opacity:.85;width:100%;height:100%}100%{opacity:0;width:340%;height:340%}}
  /* hidden until hover (or while a marker is pulsing/selected) — keeps a
     multi-site state view uncluttered, but the info is one hover away */
  .mb-mlabel{position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(3px);
    white-space:nowrap;font-family:var(--font);font-weight:700;font-size:12px;color:#fff;
    pointer-events:none;background:var(--ink);border:1px solid rgba(255,255,255,.35);
    border-radius:7px;padding:3.5px 9px;box-shadow:0 2.5px 8px rgba(20,14,55,.4);letter-spacing:.015em;
    opacity:0;transition:opacity .14s ease, transform .14s ease}
  .mb-mlabel .mw{font-weight:600;color:rgba(255,255,255,.75);margin-left:6px}
  .mb-anchor:hover .mb-mlabel{opacity:1;transform:translateX(-50%) translateY(0)}
  .mb-marker.pulse + .mb-mlabel{opacity:1;transform:translateX(-50%) translateY(0)}
  /* national choropleth interactivity */
  .state{transition:filter .16s ease, transform .18s ease;transform-box:fill-box;transform-origin:center}
  .state.active{cursor:pointer}
  .state.active:hover{filter:brightness(.9) saturate(1.12);transform:scale(1.035);
    stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
  #map > g{animation:mapfade .55s ease backwards}
  @keyframes mapfade{from{opacity:0}to{opacity:1}}
  .sat-toggle{position:absolute;top:12px;right:12px;z-index:10;display:none;
    font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:.04em;
    background:rgba(255,255,255,.93);border:1.5px solid var(--line);border-radius:8px;
    padding:6px 11px;cursor:pointer;color:var(--ink);transition:.15s}
  .sat-toggle:hover{background:#fff;border-color:var(--line2)}
  .hint{position:absolute;left:20px;top:16px;font-size:11px;color:var(--muted);letter-spacing:.04em;font-weight:600;
    pointer-events:none;background:rgba(255,255,255,.78);padding:5px 10px;border-radius:8px}
  .hint:empty{display:none}
  .legend{position:absolute;right:18px;bottom:16px;background:rgba(255,255,255,.94);
    border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:11px;line-height:1.85;color:var(--ink2);font-weight:600}
  .legend .d{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  .legend .scaletitle{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .legend .distrow{font-size:11px;color:var(--ink2);font-weight:600;line-height:1.7;white-space:nowrap}
  .legend .scalebar{width:118px;height:9px;border-radius:3px;background:linear-gradient(90deg,var(--ramp0),var(--ramp1));border:1px solid var(--line2)}
  .legend .scaleends{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);font-weight:600;margin-top:3px}
  .legend hr{border:none;border-top:1px solid var(--line);margin:9px 0}

  .state{fill:var(--land);stroke:var(--stateline);stroke-width:.85px;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:default;transition:fill .18s,stroke .12s}
  .state.active{cursor:pointer}
  .state.active:hover{stroke:var(--ink)}
  .state.neighbor{fill:#EDE8F5}
  .state.focus{fill:#D9CBEF}
  .bound{fill:none;stroke:var(--ink);stroke-width:1.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
  .slabel{fill:var(--ink2);font-family:var(--font);font-weight:700;letter-spacing:.04em;pointer-events:none;
    paint-order:stroke;stroke:#fff;stroke-width:2.6px;stroke-linejoin:round;opacity:.7}
  .county{fill:#F1ECF8;stroke:var(--landline);stroke-width:.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .county.focus{fill:#DBCBF1}
  .cbound{fill:none;stroke:var(--ink);stroke-width:1.4px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
  .clabel{fill:var(--ink2);font-family:var(--font);font-weight:600;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:2px;stroke-linejoin:round;opacity:.8}
  .marker{cursor:pointer;stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke;transition:.1s}
  .marker:hover{stroke:var(--ink)}
  .mlabel{fill:var(--ink);font-family:var(--font);font-weight:700;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:2.8px;stroke-linejoin:round}
  .pin{filter:drop-shadow(0 2px 3px rgba(36,29,90,.32))}

  .snap{display:none;flex-direction:column}
  .snap .hd h2{font-size:19px}
  .grid.has-sel .snap{display:flex}
  .snap .body{padding:18px}
  /* snapshot motion: fade-and-slide on entrance, opacity dip on same-state site switch */
  .snap .body{transition:opacity var(--t-snap) var(--ease), transform var(--t-snap) var(--ease)}
  .snap .body.entering{opacity:0;transform:translateX(18px)}
  .snap .body.swapping{opacity:0;transform:translateY(6px)}
  .sname{font-weight:800;font-size:26px;color:var(--ink);line-height:1.08;letter-spacing:-.015em}
  .sloc{margin-top:7px;display:flex;flex-direction:column;gap:2px}
  .sloc-line{font-size:13px;color:var(--muted);font-weight:600;line-height:1.35}
  .sloc-line.sloc-coord{font-size:11.5px;color:var(--dim);font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:999px;color:#fff}
  .pill.hy{background:var(--hyper)} .pill.ed{background:var(--edge)} .pill.ne{background:var(--neo)}
  .pill.untag{background:var(--panel2);color:var(--muted);border:1.5px solid var(--line)}
  .pill.status{background:var(--panel2);color:var(--ink2);border:1.5px solid var(--line2)}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:18px;background:var(--line);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .m{background:var(--panel);padding:13px 15px}
  .m .mv{font-weight:700;font-size:19px;color:var(--ink);line-height:1}
  .m .mv.gold{color:var(--gold)} .m .mv.teal{color:var(--teal)} .m .mv.sm{font-size:14px;font-weight:600}
  .m .mv.big{font-size:27px;letter-spacing:-.012em}
  .m .ml{margin-top:7px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .m .ml .est{text-transform:none;letter-spacing:.02em;color:var(--dim)}

  .ramp{margin-top:20px}
  .ramp h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);font-weight:700}
  .ramp .leg{display:flex;gap:14px;margin:12px 0 8px;font-size:10.5px;font-weight:600;color:var(--ink2)}
  .ramp .leg .sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
  .bars{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;height:120px;padding-top:18px}
  .bcell{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
  .bstack{position:relative;width:60%;max-width:40px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;transform-origin:bottom center}
  .bstack.grow{animation:barGrow .5s var(--ease-out) backwards}
  @keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .bval{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--ink);white-space:nowrap;animation:bvalFade .42s var(--ease) backwards;animation-delay:inherit}
  @keyframes bvalFade{0%{opacity:0}45%{opacity:0}100%{opacity:1}}
  .seg-gross{background:#D9CBEF;border-radius:5px 5px 0 0;width:100%}
  .seg-it{background:linear-gradient(180deg,#1397b8,#0c6a85);width:100%}
  .bstack.has .seg-it.bottom{border-radius:0 0 0 0}
  .bempty{width:60%;max-width:40px;border-bottom:2px dotted var(--line2);height:0}
  .byear{margin-top:9px;font-size:10.5px;font-weight:600;color:var(--muted)}
  .axis{border-top:1.5px solid var(--line);margin-top:0}

  .docs{margin-top:20px;border-top:1.5px solid var(--line);padding-top:15px}
  .docs h3{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:11px}

  /* ── community sentiment block ── */
  .sent{margin-top:20px}
  .sent-card{position:relative;padding:13px 15px 13px 19px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .sent-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .sent-card.danger{background:rgba(178,59,59,.07);border-color:rgba(178,59,59,.28)}
  .sent-card.danger:before{background:#B23B3B}
  .sent-card.mixed{background:#FBEFD6;border-color:#EBD9AE}
  .sent-card.mixed:before{background:var(--gold)}
  .sent-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .sent-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
  .sent-card.danger .sent-label{color:#B23B3B}
  .sent-card.mixed .sent-label{color:#7A5905}
  .sent-badge{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:#B23B3B;color:#fff;white-space:nowrap}
  .sent-card.mixed .sent-badge{background:var(--gold);color:#4A3705}
  .sent-text{font-size:12.5px;line-height:1.55;color:var(--ink2)}
  .sent-text a{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .sent-meta{margin-top:8px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .sent-meta a{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .sent-quiet{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .sent-quiet .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:4px}
  .dlrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .dl{font-size:11.5px;font-weight:600;padding:8px 12px;border-radius:9px;border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:7px;text-decoration:none}
  .dl.off{color:var(--dim);background:var(--panel2);cursor:not-allowed}
  .dl.off .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .dl.sat{color:var(--ink);background:var(--panel);cursor:pointer}
  .dl.sat:hover{border-color:var(--teal)} .dl.sat .dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}

  .m.sop-cell{background:var(--ink);cursor:pointer;
    transition:filter var(--t-micro) var(--ease)}
  .m.sop-cell:hover{filter:brightness(1.12)}
  .m.sop-cell .mv{color:#fff}
  .m.sop-cell .ml{color:rgba(255,255,255,.65)}
  .sop-modal{position:fixed;inset:0;background:rgba(36,29,90,.42);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:1000;
    opacity:0;pointer-events:none;transition:opacity var(--t-snap) var(--ease)}
  .sop-modal.open{opacity:1;pointer-events:auto}
  .sop-panel{background:var(--panel);border-radius:16px;max-width:560px;width:calc(100% - 48px);
    max-height:74vh;overflow:auto;padding:26px 28px;position:relative;
    box-shadow:0 24px 64px rgba(20,14,55,.4);
    transform:translateY(8px) scale(.985);transition:transform var(--t-snap) var(--ease-out)}
  .sop-modal.open .sop-panel{transform:none}
  .sop-close{position:absolute;top:14px;right:16px;border:0;background:none;font-size:26px;
    line-height:1;color:var(--muted);cursor:pointer}
  .sop-close:hover{color:var(--ink)}
  .sop-title{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
    font-weight:700;margin-bottom:14px;padding-right:24px}
  .sop-body{font-size:14px;line-height:1.62;color:var(--ink2)}
  .sop-body p{margin:0 0 12px} .sop-body p:last-child{margin-bottom:0}
  .sop-body ul,.sop-body ol{margin:0 0 12px;padding-left:22px}
  .sop-body ul ul,.sop-body ol ol,.sop-body ul ol,.sop-body ol ul{margin:3px 0 3px}
  .sop-body li{margin:3px 0}
  .sop-body .sop-cont{margin:2px 0 2px 22px;color:var(--muted)}
  .sop-body blockquote{margin:0 0 12px;padding:6px 14px;border-left:3px solid var(--line2);color:var(--muted);background:var(--panel2);border-radius:0 8px 8px 0}
  .sop-body code{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .sop-body a{color:var(--violet);font-weight:600}
  .sop-body .sop-h{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:14px 0 6px;font-weight:700}
  .sop-body li.sop-check{list-style:none;margin-left:-22px;padding-left:22px;position:relative}
  .sop-body li.sop-check:before{content:"\2610";position:absolute;left:0;color:var(--muted)}
  .sop-body li.sop-check.done:before{content:"\2611";color:var(--teal)}
  .sop-body li.sop-check.done{color:var(--dim);text-decoration:line-through}
  .foot{margin-top:20px;text-align:center;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:600}

  /* ── additions: attention strip + freshness ── */
  .a-tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
  .a-tile.gate:before{background:#B23B3B}.a-tile.cap:before{background:var(--gold)}.a-tile.gap:before{background:var(--dim)}
  .a-hd{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:8px}
  .a-hd .a-n{font-size:13px;letter-spacing:0;color:var(--ink);font-weight:800}
  .a-row{display:flex;align-items:baseline;gap:8px;font-size:12.5px;padding:2.5px 0;min-width:0}
  .a-name{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .a-what{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .a-when{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .a-when.past{color:#B23B3B}
  .a-sub{font-size:11px;color:var(--dim);margin-top:3px}
  .asof{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
  .asof .stale{color:#B23B3B;font-weight:700}
  .refresh{border:1.5px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:8px;
    width:24px;height:24px;cursor:pointer;font-size:13px;line-height:1;font-family:var(--font)}
  .refresh:hover{background:var(--panel2)}
  .gate-cell{cursor:default}
</style>

<script>
/* ── CONFIG ─ single source of truth for every tunable ─────────────────── */
const CONFIG = {
  IT_RATE: 0.72,                       // gross→critical estimate when Total IT Capacity is blank
  YEARS: ['2026','2027','2028','2029','2030+'],
  GATE_SOON_DAYS: 45,                  // Attention strip: gates due within this window
  STALE_MIN: 10,                       // header turns amber when data older than this
  MB_TOKEN: 'pk.eyJ1IjoiYWprYXkiLCJhIjoiY21xMWpiZDRuMDFibzJ6b3FnMnQxZ3h6YiJ9.jUUfKb6P4u8e8OQPlkK96Q',
  MB_STYLE: 'mapbox://styles/ajkay/cmq7af94x000x01s4bhnq5gil',
  MB_SAT:   'mapbox://styles/mapbox/satellite-streets-v12',
  US_TOPO:  'https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json',

// Single source of truth for bucket color: read straight from the CSS custom
// properties (--edge/--hyper/--neo) so the filter chip, the map pin, and the
// snapshot pill can never drift out of sync with each other again.
const rootCSS = getComputedStyle(document.documentElement);
const cssColor = name => rootCSS.getPropertyValue(name).trim();
const BUCKETS = [
  { id:'Edge (<100MW)', chip:'Edge (&lt;100MW)', get color(){ return cssColor('--edge'); },  cls:'ed' },
  { id:'100-300MW',     chip:'100-300MW',        get color(){ return cssColor('--hyper'); }, cls:'hy' },
  { id:'300MW+',        chip:'300MW+',           get color(){ return cssColor('--neo'); },   cls:'ne' },
];
const bucketMeta = id => BUCKETS.find(b => b.id === id) || { color:'#6B6280', cls:'preq' };
// Community sentiment: same "meta lookup by id, class drives color" pattern as
// bucketMeta above, reusing tokens already on the page (danger red from the
// Attention strip's overdue-gate styling, gold from --gold, dim/green already
// used elsewhere) rather than inventing a new palette.
const SENTIMENT = {
  opposed:    { cls:'danger', dot:'#B23B3B' },
  restricted: { cls:'danger', dot:'#B23B3B' },
  mixed:      { cls:'mixed',  dot:'#B8920C' },
  supportive: { cls:'quiet',  dot:'#0F6E56' },
  unknown:    { cls:'quiet',  dot:'#A79BBC' },
};
const sentimentMeta = status => SENTIMENT[String(status || 'unknown').trim().toLowerCase()] || SENTIMENT.unknown;

/* ── STATE ──────────────────────────────────────────────────────────────── */
const S = { filter:'all', level:'us', zoomedState:null, selectedId:null, view:'map', sat:false,

// clicked. Previously this was recomputed from the currently-filtered set on
// every drawUS() call, so a state's color would shift between "All" and
// "Edge" even though its actual Edge MW never moved — the scale's ceiling
// was silently changing underneath it. Recomputed only on data refresh.
let stateMaxMW = 1;
let SITES = [], US = null, fetchedAt = null;
let mbMap = null, mbMarkers = [];

const path = d3.geoPath();
const svg = d3.select('#map');

/* ── HELPERS ────────────────────────────────────────────────────────────── */
const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num  = v => v == null ? 0 : v;
const fmtN = v => v == null ? '\u2014' : (+v).toLocaleString(undefined,{maximumFractionDigits:1});
const fmt  = (v,u) => v == null ? '\u2014' : (fmtN(v) + (u||''));
// The ONE critical-MW rule. Previously KPIs summed only actuals while the grid
// and snapshot mixed in the 0.72 estimate — two views, two different totals.
const itMW = s => s.totalITMW != null ? s.totalITMW
  : (s.headlineMW != null ? Math.round(s.headlineMW * CONFIG.IT_RATE * 10) / 10 : null);
const bucket = s => s.capacityBucket || null;
const hasCoords = s => s.lat != null && s.lng != null;
const byId = id => SITES.find(x => x.id === id);

const live = () => SITES.filter(s => S.filter === 'all' || bucket(s) === S.filter);
const activeStates = () => new Set(live().map(s => s.stateName));
const inScope = () => { const L = live(); return S.zoomedState ? L.filter(s => s.stateName === S.zoomedState) : L; };
const geoSites = () => S.zoomedState ? SITES.filter(s => s.stateName === S.zoomedState) : SITES;

/* ── FILTER CHIPS (generated from BUCKETS — no duplicated labels) ───────── */
function buildChips(){
  const el = document.getElementById('ctrls');
  el.innerHTML = `<button class="chip on" data-f="all">All</button>` +
    BUCKETS.map(b => `<button class="chip ${b.cls}" data-f="${esc(b.id)}">${b.chip}</button>`).join('');
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => onFilter(c));
}
function onFilter(c){
  if (c.classList.contains('disabled')) return;
  document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); S.filter = c.dataset.f;
  if (S.view === 'grid'){ renderGrid(); return; }
  if (S.level === 'us'){ drawUS(); return; }
  // state/county: fade markers, redraw the SET only — the camera does not move
  // on a filter change (it used to re-fit bounds every time, which read as a glitch)
  const anchors = document.querySelectorAll('.mb-anchor');
  const redraw = () => {
    if (S.level === 'county'){ closeSnap(); S.level = 'state'; }
    renderStateMarkers(); kpis();
  };
  if (anchors.length){ anchors.forEach(a => a.classList.add('fading')); setTimeout(redraw, 180); }
  else redraw();
}
function updateChips(){
  const present = new Set(geoSites().map(bucket).filter(Boolean));
  document.querySelectorAll('.chip[data-f]').forEach(c => {
    if (c.dataset.f === 'all'){ c.classList.remove('disabled'); return; }
    c.classList.toggle('disabled', !present.has(c.dataset.f));
  });
  if (S.filter !== 'all' && !present.has(S.filter)){
    S.filter = 'all';
    document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.toggle('on', x.dataset.f === 'all'));
  }
}

/* ── KPIs ───────────────────────────────────────────────────────────────── */
const _kpiPrev = {}; // animate from previous value, not from 0, so unchanged KPIs don't replay
function kpis(){
  const L = inScope();
  const mw = Math.round(L.reduce((a,s) => a + num(s.headlineMW), 0) * 10) / 10;
  const ac = Math.round(L.reduce((a,s) => a + num(s.acres), 0));
  const it = Math.round(L.reduce((a,s) => a + num(itMW(s)), 0) * 10) / 10;
  const el = document.getElementById('kpis');
  el.style.display = S.level === 'county' ? 'none' : '';
  if (S.level === 'county'){ el.innerHTML = ''; return; }
  const C = (k,v) => `<span class="cnt" data-k="${k}" data-v="${v}">0</span>`;
  el.innerHTML = S.zoomedState ? `
    <div class="kpi"><div class="n">${C('sites',L.length)}</div><div class="l">Active Sites</div></div>
    <div class="kpi cap"><div class="n">${C('mw',mw)}<span class="u">MW</span></div><div class="l">Total Gross Capacity</div></div>
    <div class="kpi it"><div class="n">${C('it',it)}<span class="u">MW</span></div><div class="l">Critical Capacity<span class="est">est.</span></div></div>
    <div class="kpi"><div class="n">${C('ac',ac)}<span class="u">ac</span></div><div class="l">Total Acres</div></div>` : `
    <div class="kpi"><div class="n">${C('sites',L.length)}</div><div class="l">Active Sites</div></div>
    <div class="kpi"><div class="n">${C('st',activeStates().size)}</div><div class="l">States</div></div>
    <div class="kpi cap"><div class="n">${C('mw',mw)}<span class="u">MW</span></div><div class="l">Total Gross Capacity</div></div>
    <div class="kpi"><div class="n">${C('ac',ac)}<span class="u">ac</span></div><div class="l">Total Acres</div></div>`;
  el.querySelectorAll('.cnt').forEach(node => {
    const target = +node.dataset.v, from = _kpiPrev[node.dataset.k] ?? 0;
    _kpiPrev[node.dataset.k] = target;
    if (from === target){ node.textContent = fmtN(target); return; }
    const dur = 480, t0 = performance.now();
    (function tick(t){
      const p = Math.min(1,(t - t0)/dur), e = 1 - Math.pow(1 - p, 3);
      node.textContent = fmtN(Math.round((from + (target - from)*e)*10)/10);
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  });
}

}

/* ── MAPBOX (state/site views) ──────────────────────────────────────────── */
function initMapbox(){
  if (mbMap) return;
  mapboxgl.accessToken = CONFIG.MB_TOKEN;
  mbMap = new mapboxgl.Map({ container:'mbmap', style:CONFIG.MB_STYLE, center:[-96,38], zoom:3.8, interactive:true, attributionControl:false });
  mbMap.addControl(new mapboxgl.AttributionControl({ compact:true }));
  new ResizeObserver(() => { if (mbMap) mbMap.resize(); }).observe(document.getElementById('mbmap'));
}
function clearMarkers(){ mbMarkers.forEach(m => m.remove()); mbMarkers = []; }
function addMarker(s, onClick, opts = {}){
  const color = bucketMeta(bucket(s)).color;
  const root = document.createElement('div');
  root.className = 'mb-anchor';
  const dot = document.createElement('div');
  dot.className = 'mb-marker' + (opts.pulse ? ' pulse' : '');
  dot.style.cssText = `background:${color};color:${color};animation-delay:${(opts.i||0)*70}ms`;
  const label = document.createElement('div');
  label.className = 'mb-mlabel';
  label.style.background = color;
  const mwTxt = s.headlineMW != null ? `<span class="mw">${fmtN(s.headlineMW)} MW</span>` : '';
  label.innerHTML = `${esc(s.name.replace(/\s*\(.*\)/, ''))}${mwTxt}`;
  root.appendChild(dot); root.appendChild(label);
  if (onClick) root.addEventListener('click', e => { e.stopPropagation(); onClick(s); });
  mbMarkers.push(new mapboxgl.Marker({ element:root, anchor:'center' }).setLngLat([s.lng, s.lat]).addTo(mbMap));
}
function showMapbox(){
  initMapbox();
  const mb = document.getElementById('mbmap'), d3map = document.getElementById('map');
  mb.style.display = 'block';
  document.getElementById('satToggle').style.display = 'block';
  d3map.classList.add('fade');
  requestAnimationFrame(() => { mb.classList.add('show'); });
  setTimeout(() => { d3map.style.display = 'none'; if (mbMap) mbMap.resize(); }, 340);
}
function hideMapbox(){
  clearMarkers();
  const d3map = document.getElementById('map');
  d3map.style.display = 'block';
  requestAnimationFrame(() => { d3map.classList.remove('fade'); });
  if (!mbMap) return;
  document.getElementById('mbmap').classList.remove('show');
  document.getElementById('satToggle').style.display = 'none';
  setTimeout(() => { document.getElementById('mbmap').style.display = 'none'; }, 340);
}
function flyTo(opts){
  requestAnimationFrame(() => {
    mbMap.resize();
    const go = () => mbMap.flyTo(Object.assign({ duration:700, essential:true }, opts));
    if (mbMap.isStyleLoaded()) go(); else mbMap.once('load', go);
  });
}
function fitBounds(b, opts){
  requestAnimationFrame(() => {
    mbMap.resize();
    const go = () => mbMap.fitBounds(b, Object.assign({ padding:60, duration:700, essential:true }, opts));
    if (mbMap.isStyleLoaded()) go(); else mbMap.once('load', go);
  });
}
function toggleSat(){
  if (!mbMap) return;
  S.sat = !S.sat;
  mbMap.setStyle(S.sat ? CONFIG.MB_SAT : CONFIG.MB_STYLE);
  document.getElementById('satToggle').textContent = S.sat ? '\u{1F5FA} Map' : '\u{1F6F0} Satellite';
}

/* ── DRILL: STATE ───────────────────────────────────────────────────────── */
// Markers and camera are decoupled: filter changes redraw markers only;
// entering a state (or the scope changing) moves the camera.
function renderStateMarkers(){
  clearMarkers();
  const here = inScope().filter(hasCoords);
  here.forEach((s,i) => addMarker(s, site => pick(site.id), { i }));
  return here;
}
function fitStateCamera(here){
  if (here.length === 1) flyTo({ center:[here[0].lng, here[0].lat], zoom:8.5 });
  else if (here.length > 1){
    const b = new mapboxgl.LngLatBounds();
    here.forEach(s => b.extend([s.lng, s.lat]));
    fitBounds(b, { padding:{ top:90, bottom:90, left:90, right:90 }, maxZoom:9 });
  } else flyTo({ center:[-96,38], zoom:5 });
}
function drillState(stateName){
  S.level = 'state'; S.zoomedState = stateName; S.selectedId = null;
  document.getElementById('ctrls').style.display = 'flex';
  updateChips();
  setCrumbs([{ label:'National', go:() => drawUS() }, { label:stateName }]);
  document.getElementById('hint').textContent = 'Click a site marker for the project snapshot';
  document.getElementById('grid').classList.remove('has-sel');
  svg.selectAll('*').remove();
  showMapbox();
  fitStateCamera(renderStateMarkers());
  kpis(); legendHide();
}
function closeSnap(){ document.getElementById('grid').classList.remove('has-sel'); S.selectedId = null; }

/* ── DRILL: SITE ────────────────────────────────────────────────────────── */
function drillCounty(s){
  S.level = 'county';
  document.getElementById('ctrls').style.display = 'none';
  setCrumbs([
    { label:'National', go:() => drawUS() },
    { label:S.zoomedState, go:() => { closeSnap(); drillState(S.zoomedState); } },
    { label: s.county ? s.county + ' County' : S.zoomedState },
  ]);
  document.getElementById('hint').textContent = '';
  svg.selectAll('*').remove();
  if (hasCoords(s)){
    showMapbox();
    clearMarkers();
    addMarker(s, null, { pulse:true });
    flyTo({ center:[s.lng, s.lat], zoom:12.5 });
  } else {
    // No coordinates: keep the state map with the snapshot open, rather than
    // pretending we know where the site is. (Replaces the dead CLUSTERS branch.)
    showMapbox();
    fitStateCamera(renderStateMarkers());
    document.getElementById('hint').textContent = 'No coordinates on file for this site';
  }
  kpis(); legendHide();
}

function pick(id){
  const s = byId(id); if (!s) return;
  const grid = document.getElementById('grid');
  const wasOpen = grid.classList.contains('has-sel');
  const prev = S.selectedId;
  S.selectedId = id;
  if (s.stateName && S.zoomedState !== s.stateName) S.zoomedState = s.stateName;
  if (!wasOpen){
    grid.classList.add('has-sel');
    renderSnap(s);
    const body = document.querySelector('.snap .body');
    if (body){ body.classList.add('entering'); requestAnimationFrame(() => requestAnimationFrame(() => body.classList.remove('entering'))); }
  } else if (prev !== id){
    const body = document.querySelector('.snap .body');
    if (body){
      body.classList.add('swapping');
      setTimeout(() => { renderSnap(s); requestAnimationFrame(() => body.classList.remove('swapping')); }, 200);
    } else renderSnap(s);
  } else renderSnap(s);
  drillCounty(s);
}

/* ── SNAPSHOT ───────────────────────────────────────────────────────────── */
let _sopMd = '';
/* Minimal sanitizing Markdown renderer for Airtable rich text.
   Escapes ALL input first, then rebuilds only the constructs Airtable emits:
   headings, paragraphs, hard breaks, nested bullet/numbered lists, checkboxes,
   blockquotes, code, bold/italic/strikethrough, and [label](https://...) links.
   Bracketed tags like "[6/30 JK/PR call]" are NOT links (no following paren) and render literally. */
function mdInline(t){
  return t
    .replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g, (_,l,u) => `<a href="${u}" target="_blank" rel="noopener">${l}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}
function mdToHtml(md){
  const lines = esc(md).split('\n');
  let out = '', para = [], listStack = []; // listStack entries: {tag,indent}
  const flushPara = () => { if (para.length){ out += `<p>${para.map(mdInline).join('<br>')}</p>`; para = []; } };
  const closeLists = (toIndent = -1) => {
    while (listStack.length && listStack[listStack.length-1].indent > toIndent)
      out += `</${listStack.pop().tag}>`;
  };
  for (const raw of lines){
    const line = raw.replace(/\s+$/,'');
    if (!line.trim()){ flushPara(); closeLists(); continue; }
    const h3 = line.match(/^(#{1,3})\s+(.*)/);
    if (h3){ flushPara(); closeLists(); out += `<h${h3[1].length+3} class="sop-h">${mdInline(h3[2])}</h${h3[1].length+3}>`; continue; }
    const q = line.match(/^&gt;\s?(.*)/);
    if (q){ flushPara(); closeLists(); out += `<blockquote>${mdInline(q[1])}</blockquote>`; continue; }
    const li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)/);
    if (li){
      flushPara();
      const indent = li[1].replace(/\t/g,'    ').length;
      const tag = /^\d/.test(li[2]) ? 'ol' : 'ul';
      const top = listStack[listStack.length-1];
      if (!top || indent > top.indent){ listStack.push({tag,indent}); out += `<${tag}>`; }
      else if (indent < top.indent){ closeLists(indent); if(!listStack.length){ listStack.push({tag,indent}); out += `<${tag}>`; } }
      const cb = li[3].match(/^\[( |x|X)\]\s+(.*)/); // checkbox items
      out += cb
        ? `<li class="sop-check${cb[1].trim()?' done':''}">${mdInline(cb[2])}</li>`
        : `<li>${mdInline(li[3])}</li>`;
      continue;
    }
    // indented continuation of a list item stays inside the list; otherwise paragraph text
    if (listStack.length && /^\s{2,}/.test(raw)){ out += `<div class="sop-cont">${mdInline(line.trim())}</div>`; continue; }
    closeLists();
    para.push(line);
  }
  flushPara(); closeLists();
  return out;
}
// Sentiment summary text may embed a [cited fact](url) markdown link (same
// syntax mdInline already handles for State of Play notes) — that's the only
// way a specific phrase gets hyperlinked. Plain prose renders as plain text;
// we don't auto-wrap the whole paragraph in a link to the first source, since
// that reads as one giant underlined block rather than an inline citation.
function sentimentSummaryHtml(s){
  return s.sentimentSummary ? mdInline(esc(s.sentimentSummary)) : '';
}
function sentimentBlockHtml(s){
  // Status alone is enough to show something — don't require a summary too,
  // or a record with a status set but no summary yet renders nothing.
  if (!s.sentimentStatus && !s.sentimentSummary) return '';
  const meta = sentimentMeta(s.sentimentStatus);
  const summaryHtml = sentimentSummaryHtml(s) || 'No summary yet.';
  const badge = s.sentimentChanged ? `<span class="sent-badge">Changed this week</span>` : '';
  if (meta.cls === 'danger' || meta.cls === 'mixed'){
    const metaParts = [];
    if (s.sentimentLastChecked) metaParts.push('Checked ' + new Date(s.sentimentLastChecked).toLocaleDateString(undefined,{month:'short',day:'numeric'}));
    if (s.sentimentSources && s.sentimentSources.length){
      const n = s.sentimentSources.length + (s.sentimentSources.length === 1 ? ' source' : ' sources');
      metaParts.push(`<a href="${esc(s.sentimentSources[0].url)}" target="_blank" rel="noopener">${n}</a>`);
    }
    const metaLine = metaParts.length ? `<div class="sent-meta">${metaParts.join(' · ')}</div>` : '';
    return `<div class="sent"><div class="sent-card ${meta.cls}">
      <div class="sent-hd"><span class="sent-label">Community Sentiment${s.sentimentStatus ? ' · ' + esc(s.sentimentStatus) : ''}</span>${badge}</div>
      <div class="sent-text">${summaryHtml}</div>
      ${metaLine}
    </div></div>`;
  }
  return `<div class="sent"><div class="sent-quiet"><span class="dot" style="background:${meta.dot}"></span><span class="sent-text">${summaryHtml}</span></div></div>`;
}
function renderSnap(s){
  const el = document.getElementById('detail');
  _sopMd = s.notesMd || '';
  const it = itMW(s);
  const bm = bucketMeta(bucket(s));
  const coords = hasCoords(s) ? `${(+s.lat).toFixed(4)}, ${(+s.lng).toFixed(4)}` : null;
  const mapsUrl = hasCoords(s) ? `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}` : null;
  const locLines = [s.address, s.cityState, coords].filter(Boolean);
  const adds = CONFIG.YEARS.map(y => s.mwByYear ? s.mwByYear[y] : null);
  const fI = adds.findIndex(v => v != null); let lI = -1; adds.forEach((v,i) => { if (v != null) lI = i; });
  let run = 0;
  const ramp = CONFIG.YEARS.map((y,i) => {
    if (fI < 0 || i < fI || i > lI) return [y, null];
    run += num(adds[i]); return [y, run];
  });
  const mx = Math.max(1, ...ramp.map(r => num(r[1])));
  const bars = ramp.map(([yr,v],bi) => {
    if (!v) return `<div class="bcell"><div class="bempty"></div><div class="byear">${yr}</div></div>`;
    const gh = Math.max(8, (v/mx)*100);
    return `<div class="bcell"><div class="bstack grow" style="height:${gh}%;animation-delay:${bi*60}ms">
        <div class="bval">${fmtN(v)}</div>
        <div class="seg-gross" style="height:${100 - CONFIG.IT_RATE*100}%"></div>
        <div class="seg-it" style="height:${CONFIG.IT_RATE*100}%"></div>
      </div><div class="byear">${yr}</div></div>`;
  }).join('');
  const L = s.links || {};
  const chips = [];
  if (L.cda) chips.push(`<a class="dl sat" href="${esc(L.cda)}" target="_blank" rel="noopener">CDA Memo</a>`);
  if (L.pg)  chips.push(`<a class="dl sat" href="${esc(L.pg)}" target="_blank" rel="noopener">PG Analysis</a>`);
  if (L.box) chips.push(`<a class="dl sat" href="${esc(L.box)}" target="_blank" rel="noopener">Box Folder</a>`);
  const locHtml = locLines.map(line => {
    if (line === s.cityState && mapsUrl) return `<div class="sloc-line"><a href="${esc(mapsUrl)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(line)}</a></div>`;
    return `<div class="sloc-line${line === coords ? ' sloc-coord' : ''}">${esc(line)}</div>`;
  }).join('');
  const gate = s.nextGate || s.gateDate
    ? `<div class="m gate-cell"><div class="mv sm">${esc(s.nextGate || 'Gate')}${s.gateDate ? ` \u00B7 ${new Date(s.gateDate).toLocaleDateString(undefined,{month:'short',day:'numeric'})}` : ''}</div><div class="ml">Next Gate</div></div>` : '';
  el.innerHTML = `
    <div class="sname">${esc(s.name)}</div>
    <div class="sloc">${locHtml}</div>
    <div class="pills"><span class="pill status">${esc(s.status)}</span>${s.capacityBucket ? `<span class="pill ${bm.cls}">${esc(s.capacityBucket)}</span>` : ''}</div>
    <div class="metrics">
      <div class="m"><div class="mv gold big">${fmt(s.headlineMW,' MW')}</div><div class="ml">Gross Capacity</div></div>
      <div class="m"><div class="mv teal big">${fmt(it,' MW')}</div><div class="ml">Critical Capacity <span class="est">(est.)</span></div></div>
      <div class="m"><div class="mv">${fmt(s.acres,' ac')}</div><div class="ml">Acres</div></div>
      <div class="m"><div class="mv sm">${esc(s.typ) || '\u2014'}</div><div class="ml">Project Type</div></div>
      <div class="m"><div class="mv sm">${esc(s.lead) || '\u2014'}</div><div class="ml">Project Lead</div></div>
      <div class="m"><div class="mv sm">${esc(s.source) || '\u2014'}</div><div class="ml">Project Source</div></div>
      <div class="m"><div class="mv sm">${esc(s.zoning) || '\u2014'}</div><div class="ml">Zoning</div></div>
      ${gate}
      ${s.notesMd ? `<div class="m sop-cell" onclick="openSOP()"><div class="mv sm">Click to read &rsaquo;</div><div class="ml">State of Play</div></div>` : ''}
    </div>
    <div class="ramp">
      <h3>Power Capacity Build-Out</h3>
      <div class="leg">
        <span><span class="sw" style="background:linear-gradient(180deg,#1397b8,#0c6a85)"></span>Critical Capacity (MW)</span>
        <span><span class="sw" style="background:#D9CBEF"></span>Gross Capacity (MW)</span>
      </div>
      <div class="bars">${bars}</div>
      <div class="axis"></div>
    </div>
    ${sentimentBlockHtml(s)}
    ${chips.length ? `<div class="docs"><h3>Source Documents</h3><div class="dlrow">${chips.join('')}</div></div>` : ''}`;
}
function openSOP(){ document.getElementById('sopBody').innerHTML = mdToHtml(_sopMd); document.getElementById('sopModal').classList.add('open'); }
function closeSOP(){ document.getElementById('sopModal').classList.remove('open'); }

/* ── KEYBOARD NAV ───────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (document.getElementById('sopModal').classList.contains('open')){ closeSOP(); return; }
    if (S.level === 'county'){ closeSnap(); drillState(S.zoomedState); return; }
    if (S.level === 'state'){ drawUS(); return; }
    return;
  }
  // Arrow keys step through the sites currently on screen (respects filter + scope).
  // Disabled at national level (nothing mapped to step through) and while the
  // State of Play modal has focus (its own scroll takes the arrow keys).
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && S.level !== 'us'
      && !document.getElementById('sopModal').classList.contains('open')){
    const list = inScope().filter(hasCoords);
    if (!list.length) return;
    e.preventDefault();
    let idx = list.findIndex(x => x.id === S.selectedId);
    idx = idx === -1 ? 0 : (idx + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length;
    pick(list[idx].id);
  }
});

/* ── GRID VIEW ──────────────────────────────────────────────────────────── */
function setView(v){
  S.view = v;
  const grid = document.getElementById('grid');
  document.querySelectorAll('.vt').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'grid'){ renderGrid(); grid.classList.add('show-grid'); }
  else grid.classList.remove('show-grid');
}
// Text columns default to A→Z on first click; numeric columns default to
// highest-first — matches what someone reaching for that column expects.
const SORT_TEXT_KEYS = new Set(['name','lead','typ','status','bucket','cityState','county','power','utility']);
function sortVal(s, key){
  switch(key){
    case 'name': return s.name || null;       case 'lead': return s.lead || null;
    case 'typ': return s.typ || null;         case 'status': return s.status || null;
    case 'bucket': return s.capacityBucket || null; case 'cityState': return s.cityState || null;
    case 'county': return s.county || null;   case 'gross': return s.headlineMW;
    case 'critical': return itMW(s);          case 'acres': return s.acres;
    case 'power': return s.power || null;     case 'utility': return s.utility || null;
    default: return null;
  }
}
function sortRows(rows){
  const { key, dir } = S.sort;
  const mult = dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a,b) => {
    const av = sortVal(a,key), bv = sortVal(b,key);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;   // nulls always sort last, regardless of direction
    if (bv == null) return -1;
    const cmp = typeof av === 'number' ? av - bv : String(av).localeCompare(String(bv));
    return cmp * mult;
  });
}
function sortIcon(key){ return S.sort.key === key ? (S.sort.dir === 'asc' ? ' \u25B2' : ' \u25BC') : ''; }
function onSortClick(key){
  if (S.sort.key === key) S.sort.dir = S.sort.dir === 'asc' ? 'desc' : 'asc';
  else { S.sort.key = key; S.sort.dir = SORT_TEXT_KEYS.has(key) ? 'asc' : 'desc'; }
  renderGrid();
}
function clearScope(){
  S.zoomedState = null; S.selectedId = null; S.level = 'us';
  closeSnap();
  if (S.view === 'grid') renderGrid(); else drawUS();
}
function renderGrid(){
  // inScope(), not live() — Grid now reflects whatever state you drilled into
  // on the map, same as the map does. Filter-chip scope already carried over;
  // this closes the geo-scope half of the gap.
  const rows = sortRows(inScope());
  const totG = rows.reduce((s,x) => s + num(x.headlineMW), 0);
  const totC = rows.reduce((s,x) => s + num(itMW(x)), 0);
  const scopeTag = S.zoomedState
    ? `<a class="gv-clear" onclick="clearScope()" title="Back to national">${esc(S.zoomedState)} \u2715</a> \u00B7 ` : '';
  document.getElementById('gvstats').innerHTML = `${scopeTag}${rows.length} sites \u00B7 ${fmtN(Math.round(totG))} MW gross \u00B7 ${fmtN(Math.round(totC))} MW critical`;
  const dot = '<span class="dot">\u00B7</span>';
  const cell = v => v == null ? dot : fmtN(v);
  const sh = (key,label,extra='') => `<th rowspan="2" class="sortable${extra?' '+extra:''}" data-key="${key}">${label}${sortIcon(key)}</th>`;
  const head = `<thead>
    <tr>
      ${sh('name','Project','proj')}${sh('lead','Lead')}${sh('typ','Type')}
      ${sh('status','Status')}${sh('bucket','Capacity Bucket')}${sh('cityState','City, State')}
      ${sh('county','County')}<th colspan="5" class="ramphdr">Gross MW Load Ramp</th>
      ${sh('gross','Gross MW','num').replace('<th rowspan', '<th style="border-left:1.5px solid var(--line2)" rowspan')}
      ${sh('critical','Critical MW','num')}${sh('acres','Acres','num')}
      ${sh('power','Power Status')}${sh('utility','Utility')}
    </tr>
    <tr class="sub">${CONFIG.YEARS.map((y,i) => `<th class="${i===0?'rl':''}">${y==='2030+'?"'30+":"'"+y.slice(2)}</th>`).join('')}</tr>
  </thead>`;
  const body = rows.map(s => {
    const bm = bucketMeta(bucket(s));
    const sc = s.status === 'Intake' ? 'intake' : 'preq';
    const eng = /engaged/i.test(s.power || '');
    const ramp = CONFIG.YEARS.map((y,i) => `<td class="num ${i===0?'rl':''}">${cell(s.mwByYear ? s.mwByYear[y] : null)}</td>`).join('');
    return `<tr data-id="${esc(s.id)}">
      <td class="proj">${esc(s.name)}</td><td>${esc(s.lead) || '\u2014'}</td><td>${esc(s.typ) || '\u2014'}</td>
      <td><span class="gpill ${sc}">${esc(s.status) || '\u2014'}</span></td>
      <td><span class="gpill ${s.capacityBucket ? bm.cls : 'preq'}">${esc(s.capacityBucket) || '\u2014'}</span></td>
      <td>${esc(s.cityState) || '\u2014'}</td><td>${esc(s.county) || '\u2014'}</td>
      ${ramp}
      <td class="gross">${s.headlineMW != null ? fmtN(s.headlineMW) : '\u2014'}</td>
      <td class="num">${itMW(s) != null ? fmtN(itMW(s)) : '\u2014'}</td>
      <td class="num">${s.acres != null ? fmtN(s.acres) : '\u2014'}</td>
      <td><span class="${eng ? 'gpow eng' : 'gpow ns'}">${esc(s.power) || '\u2014'}</span></td>
      <td>${esc(s.utility) || '\u2014'}</td>
    </tr>`;
  }).join('');
  document.getElementById('gvtable').innerHTML = head + '<tbody>' + body + '</tbody>';
}
// One delegated listener covers both sortable header clicks and row-open
// clicks — record ids are inert data attributes, so names with quotes/HTML
// can't break or inject.
document.getElementById('gvtable').addEventListener('click', e => {
  const th = e.target.closest('th[data-key]');
  if (th){ onSortClick(th.dataset.key); return; }
  const tr = e.target.closest('tr[data-id]');
  if (tr){ setView('map'); pick(tr.dataset.id); }
});

/* ── BOOT / DATA ────────────────────────────────────────────────────────── */
async function loadSites(force){
  // ?t= busts the 60s edge cache when the operator explicitly asks for fresh numbers
  const res = await fetch('/api/sites' + (force ? `?t=${Date.now()}` : ''));
  if (!res.ok) throw new Error(`Sites API failed: ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data.sites)) throw new Error('Sites API returned an unexpected shape');
  return data;
}
async function refreshData(){ await boot(true); }
async function boot(force){
  try {
    const [topo, data] = await Promise.all([
      US ? Promise.resolve(US) : fetch(CONFIG.US_TOPO).then(r => { if (!r.ok) throw new Error('US topology failed'); return r.json(); }),
      loadSites(force),
    ]);
    US = topo;
    SITES = data.sites;
    // Full-pipeline max, every bucket included — this is the fixed ceiling
    // the choropleth scale uses; see stateMaxMW declaration for why it must
    // NOT be recomputed from whatever filter happens to be active.
    const byStateAll = {};
    SITES.forEach(s => { if (s.stateName) byStateAll[s.stateName] = (byStateAll[s.stateName] || 0) + num(s.headlineMW); });
    stateMaxMW = Math.max(1, ...Object.values(byStateAll));
    fetchedAt = new Date(data.fetchedAt || Date.now());
  } catch (err) {
    console.error('Dashboard load failed:', err);
    showLoadError();
    return; // fail loud — never paint a clean-looking empty dashboard over a failed load
  }
  buildChips();
  renderAsOf();
  if (S.view === 'grid') renderGrid();
  drawUS();
}
function showLoadError(){
  document.getElementById('kpis').style.display = 'none';
  document.querySelector('.mapwrap').innerHTML = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px">
    <div style="font-weight:700;font-size:16px;color:var(--ink)">Couldn\u2019t load the pipeline</div>
    <div style="font-size:13px;color:var(--muted);max-width:400px;line-height:1.5">
      The live data feed didn\u2019t respond. Showing nothing rather than risk showing the wrong numbers.</div>
    <button onclick="location.reload()" style="font-family:var(--font);font-size:12.5px;font-weight:600;
      color:#fff;background:var(--ink);border:0;border-radius:8px;padding:9px 18px;cursor:pointer">Retry</button>
  </div>`;
}
boot();

</script>
